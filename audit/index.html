<!doctype html><html><head><meta charset='utf-8'><title>Audit</title><link rel='stylesheet' href='/public/shared/styles.css'></head><body><div id='nav'></div><main>
<section class='card'><h2>/audit — Hash Verification + Export</h2><div class='row'>
<button id='verifyBtn'>Verify by re-hashing</button><button id='exportBtn' class='secondary'>Export JSON</button></div>
<pre id='out' class='output'></pre></section></main>
<script src='/public/shared/app.js'></script><script>
(async()=>{document.getElementById('nav').innerHTML=await (await fetch('/public/shared/nav.html')).text();await App.boot();
verifyBtn.onclick=async()=>App.msg(out,await App.api('/api/audit/verify'));
exportBtn.onclick=async()=>{const d=await App.api('/api/audit/export');App.msg(out,d);const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='audit-export.json';a.click();};})();
</script></body></html>
