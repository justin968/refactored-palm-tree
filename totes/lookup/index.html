<!doctype html><html><head><meta charset='utf-8'><title>Source Lookup</title><link rel='stylesheet' href='/public/shared/styles.css'></head><body><div id='nav'></div><main>
<section class='card'><h2>/totes/lookup — Source Lookup</h2><form id='f' class='row'>
<input name='barcode' required placeholder='Scan HU barcode'><button>Lookup</button></form>
<pre id='out' class='output'></pre>
<div id='docBox' class='output small' style='display:none'></div>
</section></main>
<script src='/public/shared/app.js'></script><script>
(async()=>{document.getElementById('nav').innerHTML=await (await fetch('/public/shared/nav.html')).text();await App.boot();
f.onsubmit=async(e)=>{e.preventDefault();const r=await App.api('/api/lookup?barcode='+encodeURIComponent(f.barcode.value));App.msg(out,r);
if(r.documents&&r.documents.length){docBox.style.display='block';docBox.textContent='Attachments:\n'+r.documents.map(d=>`- [${d.docType}] ${d.filename}`).join('\n');} else {docBox.style.display='none';}
};})();
</script></body></html>
