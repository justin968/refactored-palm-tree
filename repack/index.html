<!doctype html><html><head><meta charset='utf-8'><title>Repack</title><link rel='stylesheet' href='/public/shared/styles.css'></head><body><div id='nav'></div><main>
<section class='card'><h2>/repack — Split/Combine</h2>
<form id='f'><div class='grid'>
<label>Mode <select name='mode'><option value='split'>split</option><option value='combine'>combine</option></select></label>
<label>Source barcodes (comma) <input name='sourceBarcodes' required></label>
<label>Output SKU <select name='outputSkuId' id='outputSkuId'></select></label>
<label>Output count <input name='count' type='number' value='1'></label>
<label>Reason code <input name='reasonCode' required value='REPACK'></label>
<label>Reauth <select name='reauth'><option value='false'>false</option><option value='true'>true</option></select></label>
</div><button>Run Repack</button></form><pre id='out' class='output'></pre></section></main>
<script src='/public/shared/app.js'></script><script>
(async()=>{document.getElementById('nav').innerHTML=await (await fetch('/public/shared/nav.html')).text();await App.boot();
outputSkuId.innerHTML=App.bootstrap.skus.map(s=>`<option value='${s.id}'>${s.label}</option>`).join('');
f.onsubmit=async(e)=>{e.preventDefault();const d=Object.fromEntries(new FormData(f).entries());d.sourceBarcodes=d.sourceBarcodes.split(',').map(s=>s.trim()).filter(Boolean);d.count=Number(d.count);d.reauth=d.reauth==='true';App.msg(out,await App.api('/api/repack',{method:'POST',body:JSON.stringify(d)}));};})();
</script></body></html>
